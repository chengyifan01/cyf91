    <body background="https://cdn.luogu.com.cn/upload/image_hosting/x6llyktk.png">
		<div style="color: white">
			<p>雨谷小雨给你一个长为 n 的序列，定义区间 [l,r] 的子区间为所有形如 [l',r'] 的区间，满足 l',r' 为整数，且 l≤l'≤r'≤r。</p>
			<p>有 m 次操作：</p>
			<p>1 x y：将 x 位置的值修改为 y。</p>
			<p>2 l r x：查询区间 [l,r] 中有多少子区间的最大值小于或等于 x。</p>
		</div>
